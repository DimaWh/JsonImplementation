<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Pictures + Keyword Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        .gallery img {
            width: 250px;
            margin: 10px;
            border: 1px solid black;
        }
        hr {
            margin: 40px 0;
            border: 1px solid black;
        }
        .search-bar {
            margin: 20px 0;
        }
        .search-bar input, .search-bar button {
            padding: 8px;
            border: 1px solid black;
            background: white;
            font-family: Arial, sans-serif;
        }
        .search-bar button {
            cursor: pointer;
        }
        .gallery-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
        }
        .gallery-section {
            margin-bottom: 60px;
            scroll-margin-top: 30px;
        }
        .gallery-section h2 {
            text-align: left;
            border-bottom: 1px solid black;
            padding-bottom: 5px;
        }
        .image-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 16px;
        }
        .image-grid img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border: 1px solid black;
        }
        .highlight-section {
            outline: 2px solid black;
            outline-offset: 8px;
        }
        #searchResult {
            margin: 10px 0;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <!-- First Project: 3 Random Pictures -->
    <h2>3 Random Pictures</h2>
    <div class="gallery" id="gallery"></div>

    <hr>

    <!-- Second Project: Keyword Image Viewer -->
    <h2>Keyword Image Viewer</h2>
    <p>Type a keyword to jump to its images try: key, door, house</p>

    <div class="search-bar">
        <input type="text" id="keywordInput" placeholder="Search a keyword..." />
        <button onclick="searchKeyword()">Search</button>
    </div>

    <div id="searchResult"></div>

    <div class="gallery-container">
        <div class="gallery-section" id="section-key">
            <h2>Key</h2>
            <div class="image-grid" id="grid-key"></div>
        </div>

        <div class="gallery-section" id="section-door">
            <h2>Door</h2>
            <div class="image-grid" id="grid-door"></div>
        </div>

        <div class="gallery-section" id="section-house">
            <h2>House</h2>
            <div class="image-grid" id="grid-house"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
